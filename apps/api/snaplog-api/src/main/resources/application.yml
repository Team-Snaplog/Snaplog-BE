spring:
  application:
    name: snaplog-api
  config:
    import:
      - optional:api-core.yml
      - optional:common.yml
      - optional:mysql.yml
      - optional:redis.yml

springdoc:
  swagger-ui:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

oauth2:
  ios:
    google:
      client-id: ${OAUTH2_GOOGLE_CLIENT_ID}

server:
  port: ${SERVER_PORT}